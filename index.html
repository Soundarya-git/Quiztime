<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:#111827;
    border-radius:25px;
    padding:25px;
    border:2px solid #f59e0b;
    box-shadow:0 0 25px rgba(245,158,11,0.5);
}

h1{
    text-align:center;
    color:#fbbf24;
    margin-bottom:10px;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:25px;
    font-size:18px;
}

.question-number{
    color:#fbbf24;
    margin-bottom:10px;
    font-size:18px;
}

.question{
    color:white;
    font-size:24px;
    margin-bottom:25px;
    line-height:1.6;
}

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#1e293b;
    color:white;
    font-size:16px;
    text-align:left;
    cursor:pointer;
    transition:0.3s;
    border:2px solid transparent;
}

.option-btn:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

.correct{
    background:#16a34a !important;
    border:2px solid #bbf7d0;
}

.wrong{
    background:#dc2626 !important;
    border:2px solid #fecaca;
}

/* START SCREEN */

.start-screen{
    text-align:center;
}

.start-screen input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    outline:none;
    font-size:16px;
    margin-top:20px;
    margin-bottom:20px;
}

.start-screen button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.start-screen button:hover{
    background:#1d4ed8;
}

/* QUIZ SECTION */

.quiz-section{
    display:none;
}

/* POPUP */

.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    width:90%;
    max-width:380px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    transition:0.3s ease;
    z-index:1000;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.popup.active{
    transform:translate(-50%,-50%) scale(1);
}

.popup h2{
    margin-bottom:15px;
    font-size:28px;
}

.popup p{
    font-size:20px;
    line-height:1.7;
    color:#1e293b;
}

.popup button{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.result-box{
    text-align:center;
    color:white;
}

.result-box h2{
    font-size:32px;
    margin-bottom:20px;
    color:#fbbf24;
}

.result-box p{
    font-size:24px;
    line-height:1.8;
}

@media(max-width:600px){

    .question{
        font-size:20px;
    }

    .option-btn{
        font-size:15px;
    }

    h1{
        font-size:26px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- START SCREEN -->

    <div class="start-screen" id="startScreen">

        <h1>🛒 AMAZON QUIZ</h1>

        <p class="subtitle">
            Enter your name to start quiz
        </p>

        <input
        type="text"
        id="playerName"
        placeholder="Enter Your Name">

        <button onclick="startQuiz()">
            Start Quiz
        </button>

    </div>

    <!-- QUIZ SECTION -->

    <div class="quiz-section" id="quizSection">

        <h1>🛒 AMAZON QUIZ</h1>

        <p class="subtitle" id="welcomeText"></p>

        <div class="question-number"
        id="questionNumber"></div>

        <div class="question"
        id="question"></div>

        <div class="options"
        id="options"></div>

    </div>

    <!-- RESULT -->

    <div class="result-box" id="resultBox" style="display:none;">

        <h2>🏆 Quiz Completed</h2>

        <p id="finalScore"></p>

    </div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

    <h2 id="popupTitle"></h2>

    <p id="popupMessage"></p>

    <button id="nextBtn">
        Next
    </button>

</div>

<script>

/* QUESTIONS */

const quizData = [

{
question:"What is Amazon mainly known for?",
options:["Video Editing","Online Shopping","Gaming","Music"],
answer:"Online Shopping"
},

{
question:"What does UI stand for?",
options:["User Interface","User Input","Universal Internet","Ultra Interface"],
answer:"User Interface"
},

{
question:"What does UX focus on?",
options:["User Satisfaction","Coding","Music","Animation"],
answer:"User Satisfaction"
},

{
question:"Which language is used for Android layouts?",
options:["Python","XML","Java","C++"],
answer:"XML"
},

{
question:"Fragments are:",
options:["Reusable UI Components","Games","Servers","Databases"],
answer:"Reusable UI Components"
},

{
question:"RecyclerView is used for:",
options:["Displaying Products","Editing","Gaming","Animation"],
answer:"Displaying Products"
},

{
question:"REST API is used for:",
options:["Data Transfer","Drawing","Music","Videos"],
answer:"Data Transfer"
},

{
question:"Retrofit handles:",
options:["API Requests","Painting","Gaming","Animations"],
answer:"API Requests"
},

{
question:"JSON is used for:",
options:["Structured Data","Gaming","Editing","Drawing"],
answer:"Structured Data"
},

{
question:"Spinner provides:",
options:["Dropdown Options","Animations","Music","Games"],
answer:"Dropdown Options"
},

{
question:"AWS Cloud Servers are used to:",
options:["Host Services","Play Games","Edit Photos","Design UI"],
answer:"Host Services"
},

{
question:"Authentication helps in:",
options:["Secure Login","Painting","Editing","Gaming"],
answer:"Secure Login"
},

{
question:"SQLite is used for:",
options:["Database Storage","Gaming","Animation","Videos"],
answer:"Database Storage"
},

{
question:"CRUD stands for:",
options:[
"Create Read Update Delete",
"Copy Run Upload Draw",
"Code Read Undo Delete",
"Create Remove Upload Data"
],
answer:"Create Read Update Delete"
},

{
question:"Fragments improve:",
options:["Performance","Lag","Errors","Battery Drain"],
answer:"Performance"
},

{
question:"What is Amazon Prime?",
options:[
"Subscription Service",
"Game",
"Photo Editor",
"Music Instrument"
],
answer:"Subscription Service"
},

{
question:"Which company owns AWS?",
options:[
"Google",
"Amazon",
"Microsoft",
"Apple"
],
answer:"Amazon"
},

{
question:"What is Firebase Authentication used for?",
options:[
"Secure User Login",
"Drawing",
"Gaming",
"Animation"
],
answer:"Secure User Login"
},

{
question:"Which component helps display long lists efficiently?",
options:[
"RecyclerView",
"Spinner",
"Button",
"Toast"
],
answer:"RecyclerView"
},

{
question:"What is the main purpose of APIs?",
options:[
"Communication Between Systems",
"Gaming",
"Drawing",
"Music"
],
answer:"Communication Between Systems"
}

];

let currentQuestion = 0;
let score = 0;
let playerName = "";

/* ELEMENTS */

const startScreen = document.getElementById("startScreen");
const quizSection = document.getElementById("quizSection");
const resultBox = document.getElementById("resultBox");

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const questionNumber = document.getElementById("questionNumber");

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popupTitle");
const popupMessage = document.getElementById("popupMessage");
const nextBtn = document.getElementById("nextBtn");

const welcomeText = document.getElementById("welcomeText");
const finalScore = document.getElementById("finalScore");

/* START QUIZ */

function startQuiz(){

    playerName = document.getElementById("playerName").value.trim();

    if(playerName === ""){
        alert("Please enter your name!");
        return;
    }

    startScreen.style.display = "none";
    quizSection.style.display = "block";

    welcomeText.innerHTML =
    "Welcome, " + playerName + " 👋";

    loadQuestion();
}

/* LOAD QUESTION */

function loadQuestion(){

    let q = quizData[currentQuestion];

    questionNumber.innerHTML =
    "Question " +
    (currentQuestion + 1) +
    " of " +
    quizData.length;

    questionEl.innerHTML = q.question;

    optionsEl.innerHTML = "";

    for(let i = 0; i < q.options.length; i++){

        let btn = document.createElement("button");

        btn.className = "option-btn";

        btn.innerHTML = q.options[i];

        btn.onclick = function(){

            checkAnswer(
            q.options[i],
            q.answer,
            btn
            );

        };

        optionsEl.appendChild(btn);
    }
}

/* CHECK ANSWER */

function checkAnswer(selected, correct, button){

    let buttons =
    document.querySelectorAll(".option-btn");

    for(let i = 0; i < buttons.length; i++){
        buttons[i].disabled = true;
    }

    if(selected === correct){

        score++;

        button.classList.add("correct");

        popupTitle.innerHTML =
        "🎉 Correct Answer";

        popupMessage.innerHTML =
        "Excellent " + playerName + "!";

    }

    else{

        button.classList.add("wrong");

        for(let i = 0; i < buttons.length; i++){

            if(buttons[i].innerHTML === correct){
                buttons[i].classList.add("correct");
            }

        }

        popupTitle.innerHTML =
        "❌ Wrong Answer";

        popupMessage.innerHTML =
        "Correct Answer: " + correct;

    }

    popup.classList.add("active");
}

/* NEXT BUTTON */

nextBtn.onclick = function(){

    popup.classList.remove("active");

    currentQuestion++;

    if(currentQuestion < quizData.length){

        loadQuestion();

    }

    else{

        showResult();

    }

};

/* SHOW RESULT */

function showResult(){

    quizSection.style.display = "none";

    resultBox.style.display = "block";

    finalScore.innerHTML =
    "👏 " + playerName + "<br><br>" +
    "Your Score: " +
    score +
    " / " +
    quizData.length;

}

</script>

</body>
</html>
